<?xml version="1.0" encoding="UTF-8"?>
<!--
  DeskBase 桌库 · 应用图标（大尺寸版，48px 及以上）
  ============================================================
  设计：暖米底上两张错位的圆角纸 —— 靛青一张在后，纸白一张在前。

  为什么是这两张纸：
    · 「库」的本义是收纳。两张错位的纸就是"东西收进来、叠好"的最小表达 ——
      它是个隐喻，不是图解（上一版的九宫格是图解，被否决过）。
    · 靛青是设计系统里的主强调色，纸白是宣纸底色。图标只用了这两个颜色，
      和界面是同一套色，识别是连贯的。
    · 前面一张纸上有一道朱砂横条：那是"记录"的记号，也是整枚图标唯一的暖色重点。

  尺寸自适应（**关键**）：
    16 / 20 / 24 / 32px 用的是 **icon-small.svg**，不是把这张缩小。
    这套图里米白叠米白的对比在 16px 下会糊成一块浅色 ——
    所以小尺寸版是另画的：铺得更满、靛青改成实色（渐变在小尺寸下是脏的）、
    灰条全部去掉只留朱砂一道、四个角都加大圆角。
    分界线在 tools/icon/build-icons.cjs 的 SMALL_MAX。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024"
     width="512" height="512" role="img" aria-label="DeskBase 桌库">
  <title>DeskBase 桌库</title>
  <defs>
    <linearGradient id="tile" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#F1E9D8"/>
      <stop offset="1" stop-color="#E4D9C2"/>
    </linearGradient>
    <linearGradient id="back" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#547698"/>
      <stop offset="1" stop-color="#2E4A6B"/>
    </linearGradient>
    <linearGradient id="front" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F6F0E2"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#5A4A2E" flood-opacity="0.20"/>
    </filter>
  </defs>

  <!-- 暖米底 -->
  <rect x="40" y="40" width="944" height="944" rx="240" fill="url(#tile)"/>
  <rect x="41.5" y="41.5" width="941" height="941" rx="238.5"
        fill="none" stroke="#5A4A2E" stroke-opacity="0.10" stroke-width="3"/>

  <!-- 后面那张：靛青，向左下错开并微转 —— 手放上去的纸不会是正的 -->
  <g transform="rotate(-8 512 512)">
    <rect x="182" y="252" width="600" height="600" rx="104" fill="url(#back)"/>
  </g>

  <!-- 前面那张：纸白，带柔和投影浮起来 -->
  <rect x="238" y="200" width="600" height="600" rx="104" fill="url(#front)" filter="url(#lift)"/>
  <rect x="239.5" y="201.5" width="597" height="597" rx="102.5"
        fill="none" stroke="#5A4A2E" stroke-opacity="0.10" stroke-width="3"/>

  <!-- 纸上的记号：一道朱砂，两道墨 -->
  <rect x="322" y="330" width="356" height="44" rx="22" fill="#A63A2E"/>
  <rect x="322" y="436" width="268" height="36" rx="18" fill="#57524A" opacity="0.46"/>
  <rect x="322" y="524" width="320" height="36" rx="18" fill="#57524A" opacity="0.28"/>
</svg>
