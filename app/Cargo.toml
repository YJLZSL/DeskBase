[package]
name = "deskbase"
version = "0.4.0"
edition = "2021"
description = "DeskBase 桌库 —— 本地优先、隐私优先的办公工具箱，内置轻量数据表引擎（多表 + 关联 + 协同更新，无 SQL）"
license = "Apache-2.0"
authors = ["The DeskBase Authors"]

[dependencies]
# 外壳：Rust + 系统 WebView2（见 docs/adr/0010）
tao = "0.37"
wry = "0.57"

# 存储：**自研单文件引擎**（append-only 日志 + 快照，见 docs/adr/0021）。
# 这里**没有任何依赖** —— 去掉 SQL 之后，存储层由 `src/store/` 自己实现，
# 顺带也去掉了 libsqlite3-sys 那个 9 MB 的 sqlite3.c 编译（它在本机 MSVC 上
# 开优化会直接把编译器搞崩，原先还得为它单独关 opt-level）。

# 序列化：IPC 用 JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 标识符：业务实体主键用 ULID（见 docs/adr/0012）
ulid = "3"

# 时间：UTC 毫秒时间戳是项目的存储约定
time = { version = "0.3", features = ["formatting", "macros"] }

# Excel：读用 calamine、写用 rust_xlsxwriter。
# 两者都是 MIT/Apache-2.0，都能在 Windows 上跑，且不需要 Office。
# 为什么是这两个而不是 umya-spreadsheet：后者是唯一"读+改+写"的，但有已知的
# 转义不对称 bug（issue #143 / #167，会把含 & 的 sheet 名与公式写坏），
# 而且内存占用高一个量级。本模块的策略是**只读原文件、只写新文件，绝不改原件** ——
# 这样两个单向库就够，且用户的原件永远安全。
calamine = { version = "0.36", features = ["chrono"] }
rust_xlsxwriter = "0.99"

# 编码：CSV 导入用（app/src/csv_import.rs）。
# 中文 Excel 的「另存为 CSV」输出的是 **GBK 不是 UTF-8** —— 这是本模块存在的主要理由，
# 也是最常见的"导入进来全是乱码"的原因。GB18030 是 GBK 的超集，简体场景一个就够。
# 选它的额外好处：它本来就是 calamine 的传递依赖，**已经在 Cargo.lock 里**，
# 提成直接依赖不新增任何包、不需要联网、也不改变体积（LTO 会剔掉未用到的表）。
encoding_rs = "0.8"

# 更新器用（app/src/updater.rs，见 docs/adr/0018）。
#
# 为什么敢把这两个提成直接依赖：**它们本来就在依赖树里**，提成直接依赖
# 不新增任何包、不需要联网、体积代价接近零。与 encoding_rs 同一个理由。
#   · sha2 ← wry 已经在用（SHA-256 校验下载到的包）
#   · zip  ← calamine / rust_xlsxwriter 已经在用（检查包里确实有 deskbase.exe）
#
# 为什么不自己写 SHA-256：能写对，但没必要 —— 它是密码学原语，
# 自研的每一次"我觉得这里不会出错"都是在赌；库有 NIST 测试向量兜着。
#
# 许可证：sha2 是 MIT OR Apache-2.0，zip 是 MIT，均与 Apache-2.0 兼容。
# zip 关掉默认特性、只开 deflate —— 我们发的包就是 deflate 压缩的，
# 多开的特性（zstd/bzip2 等）每一个都会拉新包。
sha2 = "0.10"
zip = { version = "8", default-features = false, features = ["deflate"] }

# 更新器的 HTTPS 传输（体积 PoC 用，见 docs/adr/0018 第 1 节与「影响与待实测」）。
# 选 WinHTTP 而不是引 HTTP crate 的理由：HTTPS 必然要 TLS，
# 引纯 Rust 的 rustls 会拉进上 MB；WinHTTP 用的是系统 schannel，
# **体积代价只在"我们自己的胶水代码"上**。`windows` 本来就在依赖树里（webview2-com），
# 所以这一步不新增包。要实测的正是"开了这个 feature 之后到底涨多少"。
windows = { version = "0.62", features = ["Win32_Networking_WinHttp", "Win32_Foundation"] }

# 原生文件选择框（导入 Excel、选备份目录等）。
# 为什么必须是原生对话框而不是 <input type="file">：WebView2 里后者只给
# `C:\fakepath\x.xlsx` 这种假路径，拿不到真实路径，Rust 侧无法打开文件。
# 更重要的是：**路径只在 Rust 侧流转** —— 前端既不能提供路径也不能拿到路径，
# 于是渲染层没有"读任意文件"的能力（docs/08 的「渲染层无文件系统直访」）。
rfd = "0.15"

# 图片编解码：格式转换与截长图导出用（app/src/convert.rs）。
#
# **必须关掉 default-features**：默认会开 12 个格式（avif/ravif、exr、gif、hdr、
# ico、pnm、qoi、tga、dds、ff、tiff、webp）并拉进 rayon。其中 ravif 会引入
# rav1e（AV1 编码器），那是实打实的体积大头。实测：
#   baseline（不碰 image）    108 KB
#   png + jpeg + bmp          592 KB   （+472 KB）
#   再加 webp                 791 KB   （+666 KB）
# 相对 80 MB 的安装包预算占 0.8%，可以接受，所以保留 webp。
#
# 许可证全部与 Apache-2.0 兼容（image/png/image-webp 是 MIT OR Apache-2.0，
# zune-* 是 MIT OR Apache-2.0 OR Zlib，moxcms 是 BSD-3-Clause OR Apache-2.0）。
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }

[profile.release]
# 生产裁剪，见 docs/14 的体积目标
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# 注：原来这里有一段给 libsqlite3-sys 单独关 opt-level 的 workaround
# （bundled 的 sqlite3.c 在本机 MSVC 上开优化会把 cl.exe 搞崩）。
# SQL 移除后它连同整个 SQLite 一起消失了 —— 构建更快，产物更小。
