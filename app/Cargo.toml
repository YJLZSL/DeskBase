[package]
name = "deskbase"
version = "0.1.0-alpha.1"
edition = "2021"
description = "DeskBase 桌库 —— 本地优先、隐私优先的办公工具箱，内置轻量 SQL 数据库"
license = "Apache-2.0"
authors = ["The DeskBase Authors"]

[dependencies]
# 外壳：Rust + 系统 WebView2（见 docs/adr/0010）
tao = "0.37"
wry = "0.57"

# 存储：单文件嵌入式 SQLite（见 docs/adr/0003），bundled 表示自带源码编译，不依赖系统 SQLite
rusqlite = { version = "0.40", features = ["bundled"] }

# 序列化：IPC 用 JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 标识符：业务实体主键用 ULID（见 docs/adr/0012）
ulid = "3"

# 时间：UTC 毫秒时间戳是项目的存储约定
time = { version = "0.3", features = ["formatting", "macros"] }

[profile.release]
# 生产裁剪，见 docs/14 的体积目标
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# libsqlite3-sys 在 release 下会用 cl.exe 编译 bundled 的 sqlite3.c（约 9 MB 的单体 C 文件）。
# 本机 MSVC 14.51.36231 配合优化编译该文件时 cl.exe 会崩溃：
#   error occurred in cc-rs: command did not execute successfully (status code exit code: 0xc0000005)
# 0xc0000005 是 ACCESS_VIOLATION，即编译器自身挂了，不是代码问题。
# 所以单独把它的优化关掉 —— 代价只是 SQLite 的运行速度略降，换来构建能过。
[profile.release.package.libsqlite3-sys]
opt-level = 0

[profile.dev.package.libsqlite3-sys]
opt-level = 0
