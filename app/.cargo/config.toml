# 构建配置 —— 只为可复现
#
# 背景（实测，2026-09-25）：同一份源码连做两次 release 构建，exe 的 SHA-256 不一样。
# 原因是 MSVC 链接器默认把**时间戳**（以及调试信息里的绝对路径）写进 PE 头，
# 于是每次构建的二进制都不同。
#
# /Brepro = "build reproducible"：让链接器别写那些每次都变的东西。
#
# 为什么这件事重要：可复现构建意味着**任何人拿同一份源码都能验出同一个哈希**。
# 在这个项目没有代码签名证书的前提下（见 ADR-0018），它是"你下载到的确实是
# 我构建的那一份"唯一不依赖信任的证明。
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/Brepro"]
