name: 功能需求
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的想法。**请先描述你的场景，再描述你想要的方案**——
        因为了解你真正要解决的问题，往往能让我们找到更好的实现方式。

        也请先搜索已有 Issue 与 [ROADMAP.md](../blob/main/ROADMAP.md)，看看是否已在计划中。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过已有 Issue，确认这不是重复需求
          required: true
        - label: 我已读过 ROADMAP.md，该需求不在「明确的『不做』」列表中
          required: true

  - type: textarea
    id: scenario
    attributes:
      label: 你想解决什么问题
      description: 请描述真实的场景，而不是抽象的功能名
      placeholder: |
        例：我每周要把客户的微信聊天记录整理成名单，现在需要手动复制粘贴到表格里，
        几条记录还好，一次上百条就很崩溃。
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: 你现在是怎么处理的
      description: 当前用什么替代方案？它哪里让你不满意？

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的方案
      description: 如果你有想法就写下来；没有也可以留空，我们更关心上面的问题本身

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的其他方案
      description: 以及它们为什么不够好

  - type: dropdown
    id: scope
    attributes:
      label: 你认为它属于哪个模块
      options:
        - 工作台
        - 办公工具（笔记 / 文档 / 表格 / 看板 / 日历 / 待办 / 文件 / 剪贴板 / 截图 / OCR）
        - 数据库
        - 自动化
        - AI 助手
        - 远程访问
        - 备份与恢复
        - 设置
        - 帮助与教程
        - 插件（可由社区扩展实现）
        - 不知道 / 跨模块
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 对你而言的重要程度
      options:
        - 有了它我会换用这个软件
        - 会明显提升我的效率
        - 锦上添花
        - 只是随口一提
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 参考截图、类似软件的做法、灵感来源链接等

  - type: checkboxes
    id: contribute
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意自己尝试实现这个功能，并可以接受维护者的指导
        - label: 我可以帮助撰写文档或测试
